packages:
  - 'packages/*'
  - 'apps/*'

# pnpm 10+ 起 .npmrc 中的安装配置已迁移到本文件（v12 忽略 .npmrc 的 shamefully-hoist）
shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true

# 三个 uni 端（mobile / tablet / mini-program）与 uni-screen-engine 已于 2026-10-17 归档到 _archive/uni-apps-20261017/，
# 它们那条「vue 锁 3.4.21（与 @dcloudio/uni-h5-vue 同版）」的 overrides 随之移除；恢复时连同 overrides 一起搬回来
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  electron: true
  esbuild: true
  vue-demi: true
