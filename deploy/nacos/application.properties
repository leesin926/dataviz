# Nacos Server Configuration
server.port=8848
server.servlet.contextPath=/nacos

# DataSource - MySQL
spring.datasource.platform=mysql
spring.datasource.0.url=jdbc:mysql://mysql:3306/nacos_config?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&connectTimeout=10000&socketTimeout=30000&autoReconnect=true&useUnicode=true
spring.datasource.0.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.0.username=root
spring.datasource.0.password=root123456

# Connection Pool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# Auth Configuration
nacos.core.auth.enabled=true
nacos.core.auth.system.type=nacos
nacos.core.auth.default.token.expire.seconds=18000
nacos.core.auth.default.token.secret.key=c2VjcmVOMTIzNDU2Nzg5MTIzNDU2Nzg5MTIzNDU2Nzg5
nacos.core.auth.server.identity.key=serverIdentity
nacos.core.auth.server.identity.value=security

# Cluster - Standalone mode
nacos.standalone=true
