server:
  port: 8094

spring:
  application:
    name: file-service
  datasource:
    url: jdbc:mysql://localhost:3306/db_file?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:redis123456}
    database: 0
    timeout: 5000ms
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:dataviz}

# 本地存储根目录：大屏背景图等静态资源落盘位置，浏览器经 /api/file/view/{id} 免登读取
file:
  storage:
    local:
      base-path: ${FILE_LOCAL_BASE_PATH:./uploads}
      url-prefix: ${FILE_LOCAL_URL_PREFIX:http://localhost:8094/files/}

logging:
  level:
    com.dataviz.file: debug
