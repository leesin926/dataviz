server:
  port: 8094

spring:
  application:
    name: file-service
  datasource:
    url: jdbc:mysql://localhost:3306/db_file?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:redis123456}
    database: 0
    timeout: 5000ms
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    map-underscore-to-camel-case: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  # 默认值对齐 docker-compose.yml 里 minio 服务的 MINIO_ROOT_PASSWORD（minioadmin123）。
  # 原来这里写的是 minioadmin——照默认值起 minio 模式会被 MinIO 判凭据不合法，桶探测直接失败，
  # 而报错只说"探测失败"，很容易误判成容器没起。仓库惯例是 yml 默认值 == compose 值（DB_PASSWORD:root123456 同理）。
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: ${MINIO_BUCKET:dataviz}

# 本地存储根目录：大屏背景图等静态资源落盘位置，浏览器经 /api/file/view/{id} 免登读取
file:
  storage:
    # 写侧存储策略选择：local（默认）| minio。留空不静默默认，会启动即报错（见 StorageStrategyRouter）。
    # 每条 file_info 落库时记录实际处理的策略（storage_type），切换配置后老行仍按自己记录的类型读。
    type: ${FILE_STORAGE_TYPE:local}
    local:
      base-path: ${FILE_LOCAL_BASE_PATH:./uploads}
      url-prefix: ${FILE_LOCAL_URL_PREFIX:http://localhost:8094/files/}

logging:
  level:
    com.dataviz.file: debug
