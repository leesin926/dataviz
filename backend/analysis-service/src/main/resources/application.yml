server:
  port: 8086

spring:
  application:
    name: analysis-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DATAVIZ_GROUP
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DATAVIZ_GROUP
        file-extension: yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/db_analysis?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:redis123456}
    database: 0
    timeout: 5000ms
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.dataviz.analysis: DEBUG

# 查询执行链的两个服务间依赖：数据集元数据（model-service）与只读 SQL 执行（datasource-service）。
# analysis 侧不持任何业务库口令，只发 SQL 文本过去执行。
model-service:
  base-url: ${MODEL_SERVICE_URL:http://localhost:8085}
datasource-service:
  base-url: ${DATASOURCE_SERVICE_URL:http://localhost:8083}
  query-read-timeout-seconds: 35

# 与各服务配成同一个值，否则内部端点会回 403
internal:
  api:
    token: ${INTERNAL_API_TOKEN:dataviz-internal-dev-token}

analysis:
  # 结果缓存 TTL（秒），0 表示关闭。之前这段代码是"读缓存但不用缓存值"，等于没有缓存也没有失效；
  # 60s 是折中：反复点执行不至于看到 5 分钟前的旧数据。
  query-cache:
    ttl-seconds: ${ANALYSIS_QUERY_CACHE_TTL:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
