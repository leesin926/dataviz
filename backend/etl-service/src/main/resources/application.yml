server:
  port: 8084

spring:
  application:
    name: etl-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DATAVIZ_GROUP
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DATAVIZ_GROUP
        file-extension: yaml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/db_etl?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:redis123456}
    database: 0
    timeout: 5000ms
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.dataviz.etl: DEBUG

# ETL 的两条服务间通道：源端抽取（只读查询）与目标端落库（结构化批量写入）。
# etl 侧不持任何业务库口令，只把「表名 + 列名 + 标量值」发过去，口令仍留在 datasource-service。
datasource-service:
  base-url: ${DATASOURCE_SERVICE_URL:http://localhost:8083}
  query-read-timeout-seconds: 35
  write-read-timeout-seconds: 60

# 与各服务配成同一个值，否则内部端点会回 403
internal:
  api:
    token: ${INTERNAL_API_TOKEN:dataviz-internal-dev-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info
