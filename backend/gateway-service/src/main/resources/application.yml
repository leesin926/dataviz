server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    import: optional:nacos:${spring.application.name}.yaml
  web:
    resources:
      add-mappings: false
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DATAVIZ_GROUP
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DATAVIZ_GROUP
        file-extension: yaml
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # ===== Nacos-enabled services (lb://) =====
        # Auth Service (controllers mapped at /auth, /token -> strip only /api)
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        # User Service (controllers mapped at /user, /dept, /role, /permission -> strip only /api)
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/user/**,/api/dept/**,/api/role/**,/api/permission/**
          filters:
            - StripPrefix=1

        # Datasource Service
        - id: datasource-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/datasource/**
        # ETL Service (operator controller is /etl/operator without /api)
        - id: etl-operator-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/etl/operator/**
          filters:
            - StripPrefix=1
        - id: etl-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/etl/**
        # Model Service
        - id: model-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/model/**
        # Analysis Service
        - id: analysis-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/analysis/**
        # ===== Standalone services (http://) =====
        # Dashboard Service
        - id: dashboard-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/dashboard/**
        # Screen Service
        - id: screen-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/screen/**
        # Collaboration Service
        - id: collab-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/collab/**
        # Alert Service
        - id: alert-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/alert/**
        # AI Service
        - id: ai-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/ai/**
        # OpenAPI Service
        - id: openapi-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/openapi/**
        # Admin Service
        - id: admin-service
          uri: http://localhost:8093
          predicates:
            - Path=/api/admin/**
        # File Service
        - id: file-service
          uri: http://localhost:8094
          predicates:
            - Path=/api/file/**
        # Schedule Service
        - id: schedule-service
          uri: http://localhost:8095
          predicates:
            - Path=/api/schedule/**
        # Monitor Service
        - id: monitor-service
          uri: http://localhost:8096
          predicates:
            - Path=/api/monitor/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:redis123456}
    database: 0
    timeout: 5000ms

# Gateway 自有配置
gateway:
  rate-limit:
    # 网关前面有几层「可信」反向代理。默认 0 = 网关就是边缘节点，客户端地址只认 TCP 对端。
    # 只有确实前置了 N 层、且每层都往 X-Forwarded-For 末尾追加自己看到的对端时，才配成 N；
    # 配大 = 开始信任一个客户端可自填的头（限流曾被这样零成本绕开，见 docs/12 报告 19.8）。
    trusted-proxy-hops: ${GATEWAY_TRUSTED_PROXY_HOPS:0}

# Logging
logging:
  level:
    com.dataviz.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
