version: '3.8'

services:
  # ==================== 基础设施 ====================
  mysql:
    image: mysql:8.0
    container_name: dataviz-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/sql/init:/docker-entrypoint-initdb.d
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=1000
      --innodb-buffer-pool-size=512M
    networks:
      - dataviz-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dataviz-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123456 --appendonly yes --maxmemory 512mb
    volumes:
      - redis-data:/data
    networks:
      - dataviz-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: dataviz-nacos
    restart: always
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5"
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: root123456
      MYSQL_SERVICE_DB_PARAM: "jdbc:mysql://mysql:3306/nacos_config?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Shanghai"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dataviz-net

  zookeeper:
    image: zookeeper:3.9
    container_name: dataviz-zookeeper
    restart: always
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
    volumes:
      - zookeeper-data:/data
    networks:
      - dataviz-net

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: dataviz-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/kafka
    depends_on:
      - zookeeper
    networks:
      - dataviz-net

  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: dataviz-elasticsearch
    restart: always
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - dataviz-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z
    container_name: dataviz-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - dataviz-net

  mongodb:
    image: mongo:7
    container_name: dataviz-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123456
    volumes:
      - mongo-data:/data/db
    networks:
      - dataviz-net

  clickhouse:
    image: clickhouse/clickhouse-server:23.12
    container_name: dataviz-clickhouse
    restart: always
    ports:
      - "8123:8123"
      - "19000:9000"
    environment:
      CLICKHOUSE_DB: dataviz
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse123
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks:
      - dataviz-net

  # ==================== 监控 ====================
  prometheus:
    image: prom/prometheus:v2.49.1
    container_name: dataviz-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - dataviz-net

  grafana:
    image: grafana/grafana:10.3.1
    container_name: dataviz-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - dataviz-net

  # ==================== 网关 ====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: dataviz-etcd
    restart: always
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd:2379"
      ETCD_LISTEN_PEER_URLS: "http://0.0.0.0:2380"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://etcd:2380"
      ETCD_INITIAL_CLUSTER: "default=http://etcd:2380"
      ETCD_DATA_DIR: /etcd
    volumes:
      - etcd-data:/etcd
    networks:
      - dataviz-net

  apisix:
    image: apache/apisix:3.8.0-debian
    container_name: dataviz-apisix
    restart: always
    ports:
      - "80:9080"
      - "443:9443"
      - "9180:9180"
    volumes:
      - ./deploy/apisix/config.yaml:/usr/local/apisix/conf/config.yaml
    depends_on:
      - etcd
    networks:
      - dataviz-net

volumes:
  mysql-data:
  redis-data:
  zookeeper-data:
  kafka-data:
  es-data:
  minio-data:
  mongo-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  etcd-data:

networks:
  dataviz-net:
    driver: bridge
